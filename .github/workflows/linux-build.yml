name: Linux build

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'badges.json'
      - 'trusted_hashes.json'
      - 'README.md'
      - 'README.ru.md'
      - 'CHANGELOG*'
      - 'changelog.txt'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/pull_request_template.md'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    name: Rocky Linux 8
    runs-on: ubuntu-latest

    env:
      IMAGE_TAG: oxdesktop:centos_env

    steps:
      - name: Clone
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Generate Dockerfile
        run: |
          curl -sSL https://install.python-poetry.org | python3 -
          cd Telegram/build/docker/centos_env
          poetry install
          DOCKERFILE=$(DEBUG= LTO= poetry run gen_dockerfile)
          echo "$DOCKERFILE" > Dockerfile
          rm -rf __pycache__

      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Libraries
        uses: docker/build-push-action@v6
        with:
          context: Telegram/build/docker/centos_env
          load: true
          tags: ${{ env.IMAGE_TAG }}
          cache-from: type=gha,scope=docker-centos
          cache-to: type=gha,mode=max,scope=docker-centos

      - name: Restore Build cache
        uses: actions/cache/restore@v4
        with:
          path: out
          key: ${{ runner.os }}-build-out-${{ hashFiles('Telegram/SourceFiles/**', 'Telegram/CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-build-out-

      - name: Restore Compiler cache (ccache)
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: ${{ runner.os }}-ccache-${{ github.sha }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-ccache-${{ github.sha }}-
            ${{ runner.os }}-ccache-

      - name: Check restored ccache size
        run: |
          RESTORED_MB=0
          if [ -d ".ccache" ]; then
            RESTORED_MB=$(du -sm .ccache 2>/dev/null | cut -f1 || echo 0)
          fi
          echo "RESTORED_CCACHE_MB=$RESTORED_MB" >> "$GITHUB_ENV"
          echo "Restored ccache size: ${RESTORED_MB} MB" 

      - name: Synchronize version from version.txt
        run: python3 tools/sync_version.py

      - name: Build
        env:
          API_ID: ${{ secrets.TDESKTOP_API_ID }}
          API_HASH: ${{ secrets.TDESKTOP_API_HASH }}
        run: |
          API_ID="${API_ID:-17349}"
          API_HASH="${API_HASH:-344583e45741c457fe1862106095a5eb}"
          mkdir -p .ccache
          docker run --rm \
            -u "$(id -u)" \
            -v "$PWD:/usr/src/tdesktop" \
            -v "$PWD/.ccache:/var/cache/ccache" \
            -e CONFIG=Release \
            -e API_ID -e API_HASH \
            -e CCACHE_DIR=/var/cache/ccache \
            -e CCACHE_MAXSIZE=5G \
            -e CCACHE_COMPRESS=1 \
            -e CCACHE_SLOPPINESS=pch_defines,time_macros \
            -e CCACHE_BASEDIR=/usr/src/tdesktop \
            "$IMAGE_TAG" \
            bash -c '/usr/src/tdesktop/Telegram/build/docker/centos_env/build.sh \
              -D CMAKE_CONFIGURATION_TYPES=Release \
              -D TDESKTOP_API_ID="$API_ID" \
              -D TDESKTOP_API_HASH="$API_HASH" \
              -D DESKTOP_APP_DISABLE_AUTOUPDATE=ON \
              -D DESKTOP_APP_DISABLE_CRASH_REPORTS=ON \
              -D CMAKE_BUILD_WITH_INSTALL_RPATH=ON \
              && ccache -s'
          test -f out/Release/Telegram

      - name: Validate ccache size before save
        id: check_ccache
        if: always()
        run: |
          CURRENT_MB=0
          if [ -d ".ccache" ]; then
            CURRENT_MB=$(du -sm .ccache 2>/dev/null | cut -f1 || echo 0)
          fi
          RESTORED_MB="${RESTORED_CCACHE_MB:-0}"
          echo "Current ccache: ${CURRENT_MB} MB | Restored ccache: ${RESTORED_MB} MB"
          MIN_ALLOWED=$(( RESTORED_MB - 100 ))
          if [ "$RESTORED_MB" -gt 100 ] && [ "$CURRENT_MB" -lt "$MIN_ALLOWED" ]; then
            echo "WARN: Current ccache (${CURRENT_MB} MB) is smaller than restored (${RESTORED_MB} MB) by more than 100 MB. Skipping save to preserve existing cache!"
            echo "should_save=false" >> "$GITHUB_OUTPUT"
          else
            echo "Ccache size check passed. Saving cache."
            echo "should_save=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Save Compiler cache (ccache)
        if: always() && steps.check_ccache.outputs.should_save == 'true'
        uses: actions/cache/save@v4
        with:
          path: .ccache
          key: ${{ runner.os }}-ccache-${{ github.sha }}-${{ github.run_id }}

      - name: Save Build cache
        if: success()
        uses: actions/cache/save@v4
        with:
          path: out
          key: ${{ runner.os }}-build-out-${{ hashFiles('Telegram/SourceFiles/**', 'Telegram/CMakeLists.txt') }}

      - name: Package
        run: |
          VERSION=$(sed -n 's/.*AppVersionStr = "\([^"]*\)".*/\1/p' Telegram/SourceFiles/core/version.h)
          if [ "$GITHUB_EVENT_NAME" = "release" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          docker run --rm \
            -u "$(id -u)" \
            -v "$PWD:/usr/src/tdesktop" \
            -e VERSION="$VERSION" \
            "$IMAGE_TAG" \
            bash -euo pipefail -c '
              cd /usr/src/tdesktop
              PKG="pkg/oxDesktop"
              rm -rf pkg
              mkdir -p "$PKG/lib" "$PKG/python" "$PKG/python311/lib"
              cp out/Release/Telegram "$PKG/oxDesktop-bin"
              strip "$PKG/oxDesktop-bin"
              cp -L /usr/lib64/libpython3.11.so.1.0 "$PKG/lib/"
              cp -r /usr/lib64/python3.11 "$PKG/python311/lib/python3.11"
              rm -rf "$PKG/python311/lib/python3.11/test" \
                "$PKG/python311/lib/python3.11/site-packages"
              find "$PKG/python311" -name "__pycache__" -type d -prune -exec rm -rf {} +
              ln -sf lib "$PKG/python311/lib64"
              mkdir -p "$PKG/python/extera"
              cp -r Telegram/SourceFiles/extera/python/. "$PKG/python/extera/"
              cat > "$PKG/oxDesktop" <<SH
#!/bin/sh
DIR="\$(cd "\$(dirname "\$0")" && pwd)"
export LD_LIBRARY_PATH="\$DIR/lib\${LD_LIBRARY_PATH:+:\$LD_LIBRARY_PATH}"
export PYTHONHOME="\$DIR/python311"
export PYTHONPATH="\$DIR/python311/lib/python3.11:\$DIR/python311/lib/python3.11/lib-dynload"
exec "\$DIR/oxDesktop-bin" "\$@"
SH
              chmod +x "$PKG/oxDesktop" "$PKG/oxDesktop-bin"
              tar -C pkg -czf "oxDesktop-linux-x64.$VERSION.tar.gz" oxDesktop
            '
          ls -la "oxDesktop-linux-x64.$VERSION.tar.gz"

      - name: Generate Demo Screenshots
        run: |
          mkdir -p screenshots
          sudo apt-get update && sudo apt-get install -y xvfb libxcb-cursor0 libx11-xcb1 libxkbcommon-x11-0
          export DISPLAY=:99
          export QT_QPA_PLATFORM=xcb
          Xvfb :99 -screen 0 1280x800x24 -ac +extension GLX +render -noreset &
          XVFB_PID=$!
          sleep 2
          PKG="./pkg/oxDesktop/oxDesktop"
          chmod +x "$PKG" ./pkg/oxDesktop/oxDesktop-bin
          SHOTS_DIR="$PWD/screenshots"
          echo "Capturing Settings view..."
          $PKG --demo-mode --demo-view settings --demo-screenshot "$SHOTS_DIR/settings.png" --demo-delay 3500 --demo-exit || true
          echo "Capturing Appearance view..."
          $PKG --demo-mode --demo-view appearance --demo-screenshot "$SHOTS_DIR/appearance.png" --demo-delay 3500 --demo-exit || true
          echo "Capturing Chats view..."
          $PKG --demo-mode --demo-view chats --demo-screenshot "$SHOTS_DIR/chats.png" --demo-delay 3500 --demo-exit || true
          echo "Capturing Plugins view..."
          $PKG --demo-mode --demo-view plugins --demo-screenshot "$SHOTS_DIR/plugins.png" --demo-delay 3500 --demo-exit || true
          echo "Capturing Main window..."
          $PKG --demo-mode --demo-view main --demo-screenshot "$SHOTS_DIR/oxdesktop.png" --demo-delay 3500 --demo-exit || true
          kill $XVFB_PID || true
          ls -la screenshots/

      - name: Upload screenshots artifact
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: oxdesktop-screenshots-linux
          path: screenshots/*.png
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: oxDesktop-linux-x64
          path: oxDesktop-linux-x64.*.tar.gz
          retention-days: 7


      - name: Attach to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: oxDesktop-linux-x64.*.tar.gz
          overwrite_files: true