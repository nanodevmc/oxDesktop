name: Linux build

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'badges.json'
      - 'trusted_hashes.json'
      - 'README.md'
      - 'README.ru.md'
      - 'CHANGELOG*'
      - 'changelog.txt'
      - 'install.sh'
      - 'install.ps1'
      - 'scripts/**'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/pull_request_template.md'
      - '.github/workflows/generate-screenshots.yml'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  linux:
    name: Rocky Linux 8
    runs-on: ubuntu-latest

    env:
      IMAGE_TAG: oxdesktop:centos_env

    steps:
      - name: Clone
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Generate Dockerfile
        run: |
          python3 -m pip install --break-system-packages poetry || pipx install poetry || (curl -sSL --retry 5 --retry-delay 3 https://install.python-poetry.org | python3 -)
          cd Telegram/build/docker/centos_env
          poetry install
          DOCKERFILE=$(DEBUG= LTO= poetry run gen_dockerfile)
          echo "$DOCKERFILE" > Dockerfile
          rm -rf __pycache__

      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Libraries
        uses: docker/build-push-action@v6
        with:
          context: Telegram/build/docker/centos_env
          load: true
          tags: ${{ env.IMAGE_TAG }}
          cache-from: type=gha,scope=docker-centos

      - name: Restore Compiler cache (ccache)
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: ${{ runner.os }}-ccache-${{ github.sha }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-ccache-${{ github.sha }}-
            ${{ runner.os }}-ccache-

      - name: Check restored ccache size
        run: |
          RESTORED_MB=0
          if [ -d ".ccache" ]; then
            RESTORED_MB=$(du -sm .ccache 2>/dev/null | cut -f1 || echo 0)
          fi
          echo "RESTORED_CCACHE_MB=$RESTORED_MB" >> "$GITHUB_ENV"
          echo "Restored ccache size: ${RESTORED_MB} MB" 

      - name: Synchronize version from version.txt
        run: python3 tools/sync_version.py

      - name: Build
        env:
          API_ID: ${{ secrets.TDESKTOP_API_ID }}
          API_HASH: ${{ secrets.TDESKTOP_API_HASH }}
        run: |
          API_ID="${API_ID:-17349}"
          API_HASH="${API_HASH:-344583e45741c457fe1862106095a5eb}"
          mkdir -p .ccache
          docker run --rm \
            -u "$(id -u)" \
            -v "$PWD:/usr/src/tdesktop" \
            -v "$PWD/.ccache:/var/cache/ccache" \
            -e CONFIG=Release \
            -e API_ID -e API_HASH \
            -e CCACHE_DIR=/var/cache/ccache \
            -e CCACHE_MAXSIZE=3500M \
            -e CCACHE_COMPRESS=1 \
            -e CCACHE_SLOPPINESS=pch_defines,time_macros,include_file_ctime,include_file_mtime \
            -e CCACHE_COMPRESSLEVEL=5 \
            -e CCACHE_BASEDIR=/usr/src/tdesktop \
            "$IMAGE_TAG" \
            bash -c '/usr/src/tdesktop/Telegram/build/docker/centos_env/build.sh \
              -D CMAKE_CONFIGURATION_TYPES=Release \
              -D TDESKTOP_API_ID="$API_ID" \
              -D TDESKTOP_API_HASH="$API_HASH" \
              -D DESKTOP_APP_DISABLE_AUTOUPDATE=ON \
              -D DESKTOP_APP_DISABLE_CRASH_REPORTS=ON \
              -D CMAKE_BUILD_WITH_INSTALL_RPATH=ON \
              && ccache -s'
          test -f out/Release/Telegram

      - name: Validate ccache size before save
        id: check_ccache
        if: always()
        run: |
          CURRENT_MB=0
          if [ -d ".ccache" ]; then
            CURRENT_MB=$(du -sm .ccache 2>/dev/null | cut -f1 || echo 0)
          fi
          RESTORED_MB="${RESTORED_CCACHE_MB:-0}"
          echo "Current ccache: ${CURRENT_MB} MB | Restored ccache: ${RESTORED_MB} MB"
          MIN_ALLOWED=$(( RESTORED_MB - 100 ))
          if [ "$RESTORED_MB" -gt 100 ] && [ "$CURRENT_MB" -lt "$MIN_ALLOWED" ]; then
            echo "WARN: Current ccache (${CURRENT_MB} MB) is smaller than restored (${RESTORED_MB} MB) by more than 100 MB. Skipping save to preserve existing cache!"
            echo "should_save=false" >> "$GITHUB_OUTPUT"
          else
            echo "Ccache size check passed. Saving cache."
            echo "should_save=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Save Compiler cache (ccache)
        if: always() && steps.check_ccache.outputs.should_save == 'true'
        uses: actions/cache/save@v4
        with:
          path: .ccache
          key: ${{ runner.os }}-ccache-${{ github.sha }}-${{ github.run_id }}

      - name: Prune older ccache entries
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          caches=$(gh api -H "Accept: application/vnd.github+json" "/repos/${{ github.repository }}/actions/caches?key=Linux-ccache-" --jq '.actions_caches | sort_by(.last_accessed_at) | reverse | .[1:][].id' || true)
          for id in $caches; do
            echo "Pruning superseded Linux ccache ID: $id"
            gh api -X DELETE "/repos/${{ github.repository }}/actions/caches/$id" || true
          done

      - name: Package
        run: |
          VERSION=$(sed -n 's/.*AppVersionStr = "\([^"]*\)".*/\1/p' Telegram/SourceFiles/core/version.h)
          if [ "$GITHUB_EVENT_NAME" = "release" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          docker run --rm \
            -u "$(id -u)" \
            -v "$PWD:/usr/src/tdesktop" \
            -e VERSION="$VERSION" \
            "$IMAGE_TAG" \
            bash -euo pipefail -c '
              cd /usr/src/tdesktop
              PKG="pkg/oxDesktop"
              rm -rf pkg
              mkdir -p "$PKG/lib" "$PKG/python" "$PKG/python311/lib"
              cp out/Release/Telegram "$PKG/oxDesktop-bin"
              strip "$PKG/oxDesktop-bin"
              cp -L /usr/lib64/libpython3.11.so.1.0 "$PKG/lib/"
              cp -r /usr/lib64/python3.11 "$PKG/python311/lib/python3.11"
              rm -rf "$PKG/python311/lib/python3.11/test" \
                "$PKG/python311/lib/python3.11/site-packages"
              find "$PKG/python311" -name "__pycache__" -type d -prune -exec rm -rf {} +
              ln -sf lib "$PKG/python311/lib64"
              mkdir -p "$PKG/python/extera"
              cp -r Telegram/SourceFiles/extera/python/. "$PKG/python/extera/"
              cat > "$PKG/oxDesktop" <<SH
          #!/bin/sh
          DIR="\$(cd "\$(dirname "\$0")" && pwd)"
          export LD_LIBRARY_PATH="\$DIR/lib\${LD_LIBRARY_PATH:+:\$LD_LIBRARY_PATH}"
          export PYTHONHOME="\$DIR/python311"
          export PYTHONPATH="\$DIR/python311/lib/python3.11:\$DIR/python311/lib/python3.11/lib-dynload"
          exec "\$DIR/oxDesktop-bin" "\$@"
          SH
              chmod +x "$PKG/oxDesktop" "$PKG/oxDesktop-bin"
              GZIP="-9" tar -C pkg -czf "oxDesktop-linux-x64.$VERSION.tar.gz" oxDesktop
            '
          ls -la "oxDesktop-linux-x64.$VERSION.tar.gz"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: oxDesktop-linux-x64
          path: oxDesktop-linux-x64.*.tar.gz
          compression-level: 9
          retention-days: 7

      - name: Generate Demo Screenshots
        timeout-minutes: 10
        continue-on-error: true
        run: |
          mkdir -p screenshots
          sudo apt-get update -o Acquire::Retries=3 -o Acquire::http::Timeout=15 && sudo apt-get install -y -o Acquire::Retries=3 -o Acquire::http::Timeout=15 --fix-missing \
            xvfb \
            ffmpeg \
            dbus-x11 \
            xdg-desktop-portal \
            xdg-desktop-portal-gtk \
            at-spi2-core \
            fonts-dejavu-core \
            libxcb-cursor0 \
            libx11-xcb1 \
            libxkbcommon-x11-0 \
            libgl1-mesa-dri \
            libglx-mesa0
          export DISPLAY=:99
          export NO_AT_SPI=1
          export QT_QPA_PLATFORM=xcb
          export LIBGL_ALWAYS_SOFTWARE=1
          export MESA_LOADER_DRIVER_OVERRIDE=llvmpipe
          export QT_XCB_GL_INTEGRATION=none
          unset XDG_CURRENT_DESKTOP
          unset DESKTOP_SESSION
          unset XDG_SESSION_DESKTOP
          unset GNOME_DESKTOP_SESSION_ID
          export QT_QPA_PLATFORMTHEME=""

          Xvfb :99 -screen 0 1280x800x24 -ac +extension GLX +render -noreset &
          XVFB_PID=$!
          sleep 3

          PKG="./pkg/oxDesktop/oxDesktop"
          chmod +x "$PKG" ./pkg/oxDesktop/oxDesktop-bin
          SHOTS_DIR="$PWD/screenshots"

          dbus-run-session bash -c "
            if [ -x /usr/libexec/xdg-desktop-portal ]; then
              /usr/libexec/xdg-desktop-portal &
            elif [ -x /usr/lib/xdg-desktop-portal ]; then
              /usr/lib/xdg-desktop-portal &
            fi
            if [ -x /usr/libexec/xdg-desktop-portal-gtk ]; then
              /usr/libexec/xdg-desktop-portal-gtk &
            elif [ -x /usr/lib/xdg-desktop-portal-gtk ]; then
              /usr/lib/xdg-desktop-portal-gtk &
            fi
            sleep 2

            export DISPLAY=:99
            export NO_AT_SPI=1
            export QT_QPA_PLATFORM=xcb
            export LIBGL_ALWAYS_SOFTWARE=1
            export MESA_LOADER_DRIVER_OVERRIDE=llvmpipe
            export QT_XCB_GL_INTEGRATION=none
            unset XDG_CURRENT_DESKTOP
            unset DESKTOP_SESSION
            unset XDG_SESSION_DESKTOP
            unset GNOME_DESKTOP_SESSION_ID
            export QT_QPA_PLATFORMTHEME=''

            echo 'Capturing Settings view...'
            $PKG -many -workdir /tmp/prof_settings --demo-mode --demo-view settings --demo-screenshot '$SHOTS_DIR/settings.png' --demo-delay 3500 --demo-exit || true
            sleep 2

            echo 'Capturing Appearance view...'
            $PKG -many -workdir /tmp/prof_appearance --demo-mode --demo-view appearance --demo-screenshot '$SHOTS_DIR/appearance.png' --demo-delay 3500 --demo-exit || true
            sleep 2

            echo 'Capturing Chats view...'
            $PKG -many -workdir /tmp/prof_chats --demo-mode --demo-view chats --demo-screenshot '$SHOTS_DIR/chats.png' --demo-delay 3500 --demo-exit || true
            sleep 2

            echo 'Capturing Plugins view...'
            $PKG -many -workdir /tmp/prof_plugins --demo-mode --demo-view plugins --demo-screenshot '$SHOTS_DIR/plugins.png' --demo-delay 3500 --demo-exit || true
            sleep 2

            echo 'Capturing Main window...'
            $PKG -many -workdir /tmp/prof_main --demo-mode --demo-view main --demo-screenshot '$SHOTS_DIR/oxdesktop.png' --demo-delay 3500 --demo-exit || true
          "

          echo "Recording 15s intro animation video..."
          python3 scripts/record_intro_video.py || true

          kill $XVFB_PID || true
          ls -la screenshots/

      - name: Upload screenshots artifact
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: oxdesktop-screenshots-linux
          path: |
            screenshots/*.png
            screenshots/*.mp4
          if-no-files-found: ignore
          compression-level: 9
          retention-days: 7

      - name: Attach to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: oxDesktop-linux-x64.*.tar.gz
          overwrite_files: true