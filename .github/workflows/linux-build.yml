name: Linux build

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'badges.json'
      - 'trusted_hashes.json'
      - 'README.md'
      - 'README.ru.md'
      - 'CHANGELOG*'
      - 'changelog.txt'
      - 'install.sh'
      - 'install.ps1'
      - 'scripts/**'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/pull_request_template.md'
      - '.github/workflows/generate-screenshots.yml'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  linux:
    name: Rocky Linux 8
    if: github.event_name != 'release' || (!startsWith(github.event.release.tag_name, 'ci-cache') && !contains(github.event.release.tag_name, 'cache'))
    runs-on: ubuntu-latest

    env:
      IMAGE_TAG: oxdesktop:centos_env

    steps:
      - name: Clone
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Checkout submodules (shallow & parallel)
        run: |
          git submodule update --init --recursive --depth 1 --jobs 8
          python3 tools/patch_lib_ui.py

      - name: Restore offline OCR cache
        id: cache-ocr
        uses: actions/cache@v4
        with:
          path: ocr_runtime
          key: oxdesktop-ocr-v1-linux64-${{ hashFiles('tools/prepare_ocr.py') }}

      - name: Prepare offline OCR runtime and models
        if: steps.cache-ocr.outputs.cache-hit != 'true'
        run: |
          command -v 7z >/dev/null 2>&1 || (sudo apt-get update -o Acquire::Retries=3 && sudo apt-get install -y p7zip-full)
          python3 tools/prepare_ocr.py --platform linux64 --out "${{ github.workspace }}/ocr_runtime"

      - name: Check for C++ core changes
        id: diff_check
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          NEED_BUILD=true
          LAST_RUN=$(gh run list --workflow="Linux build" --status=success --limit=1 -R "$GH_REPO" --json databaseId,headSha --jq '.[0]' 2>/dev/null || echo "")
          if [ -n "$LAST_RUN" ]; then
            LAST_SHA=$(echo "$LAST_RUN" | jq -r '.headSha')
            LAST_ID=$(echo "$LAST_RUN" | jq -r '.databaseId')
            echo "Last successful Linux build: Run $LAST_ID @ $LAST_SHA"
            git fetch --depth=50 origin main 2>/dev/null || true
            RAW_DIFF=$(git diff --name-only "$LAST_SHA" HEAD -- Telegram/SourceFiles/ Telegram/build/ docker/ cmake/ CMakeLists.txt || true)
            CPP_DIFF=$(echo "$RAW_DIFF" | grep -v '^Telegram/SourceFiles/extera/rust/' | grep -v '^Telegram/SourceFiles/extera/python/' | grep -v '\.md$' | grep -v '^$' || true)
            if [ -z "$CPP_DIFF" ]; then
              echo "No C++ core changes detected between $LAST_SHA and HEAD!"
              echo "Fetching prebuilt Linux binary from run $LAST_ID..."
              mkdir -p temp_prev_linux
              if gh run download "$LAST_ID" -n oxDesktop-linux-x64 --dir temp_prev_linux 2>/dev/null; then
                TAR_FILE=$(find temp_prev_linux -name "*.tar.gz" | head -n 1)
                if [ -n "$TAR_FILE" ]; then
                  mkdir -p out/Release pkg
                  tar -xzf "$TAR_FILE" -C out/Release/ || true
                  tar -xzf "$TAR_FILE" -C pkg/ 2>/dev/null || true
                  if [ -f "out/Release/Telegram" ] || [ -f "pkg/oxDesktop/oxDesktop-bin" ] || [ -f "out/Release/oxDesktop/oxDesktop-bin" ]; then
                    echo "Telegram prebuilt binary restored successfully from run $LAST_ID!"
                    NEED_BUILD=false
                  fi
                fi
                rm -rf temp_prev_linux
              fi
            else
              echo "C++ core files changed:"
              echo "$CPP_DIFF"
            fi
          fi
          if [ "$NEED_BUILD" = "true" ]; then
            echo "Full C++ compilation will run."
            echo "skip_cpp_build=false" >> "$GITHUB_OUTPUT"
          else
            echo "Fast path activated: skipping Docker C++ build and heavy caches!"
            echo "skip_cpp_build=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate Dockerfile
        if: steps.diff_check.outputs.skip_cpp_build != 'true'
        run: |
          python3 -m pip install --break-system-packages poetry || pipx install poetry || (curl -sSL --retry 5 --retry-delay 3 https://install.python-poetry.org | python3 -)
          cd Telegram/build/docker/centos_env
          poetry install
          DOCKERFILE=$(DEBUG= LTO= poetry run gen_dockerfile)
          echo "$DOCKERFILE" > Dockerfile
          rm -rf __pycache__

      - name: Free disk space
        if: steps.diff_check.outputs.skip_cpp_build != 'true'
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true

      - name: Set up Docker Buildx
        if: steps.diff_check.outputs.skip_cpp_build != 'true'
        uses: docker/setup-buildx-action@v3

      - name: Restore Docker environment from Release
        if: steps.diff_check.outputs.skip_cpp_build != 'true'
        id: docker_release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          command -v zstd >/dev/null 2>&1 || { sudo apt-get update && sudo apt-get install -y zstd; }
          ARCHIVE="oxDesktop-centos-env.tar.zst"
          if gh release download ci-cache -R "$GH_REPO" -p "$ARCHIVE" 2>/dev/null; then
            echo "Found prebuilt Docker environment in release! Loading..."
            zstd -d -c "$ARCHIVE" | docker load
            rm -f "$ARCHIVE"
            echo "DOCKER_CACHE_HIT=true" >> "$GITHUB_ENV"
          else
            echo "Prebuilt Docker environment not found in release, will build."
            echo "DOCKER_CACHE_HIT=false" >> "$GITHUB_ENV"
          fi

      - name: Libraries
        if: steps.diff_check.outputs.skip_cpp_build != 'true' && env.DOCKER_CACHE_HIT != 'true'
        uses: docker/build-push-action@v6
        with:
          context: Telegram/build/docker/centos_env
          load: true
          tags: ${{ env.IMAGE_TAG }}
          cache-from: type=gha,scope=docker-centos

      - name: Publish Docker environment to Release (one-time)
        if: steps.diff_check.outputs.skip_cpp_build != 'true' && success() && env.DOCKER_CACHE_HIT != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          command -v zstd >/dev/null 2>&1 || { sudo apt-get update && sudo apt-get install -y zstd; }
          ARCHIVE="oxDesktop-centos-env.tar.zst"
          echo "Exporting and compressing Docker image $IMAGE_TAG..."
          docker save "$IMAGE_TAG" | zstd -3 -T0 -o "$ARCHIVE"
          ls -lh "$ARCHIVE"
          if gh release view ci-cache -R "$GH_REPO" >/dev/null 2>&1; then
            gh release upload ci-cache "$ARCHIVE" -R "$GH_REPO" --clobber
          else
            gh release create ci-cache "$ARCHIVE" -R "$GH_REPO" --title "CI Cache (Automated Prebuilt Assets)" --notes "Automated permanent prebuilt libraries and docker cache" --prerelease
          fi
          rm -f "$ARCHIVE"

      - name: Restore Compiler cache (ccache)
        if: steps.diff_check.outputs.skip_cpp_build != 'true'
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: ${{ runner.os }}-ccache-${{ github.sha }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-ccache-${{ github.sha }}-
            ${{ runner.os }}-ccache-

      - name: Check restored ccache size
        if: steps.diff_check.outputs.skip_cpp_build != 'true'
        run: |
          RESTORED_MB=0
          if [ -d ".ccache" ]; then
            RESTORED_MB=$(du -sm .ccache 2>/dev/null | cut -f1 || echo 0)
          fi
          echo "RESTORED_CCACHE_MB=$RESTORED_MB" >> "$GITHUB_ENV"
          echo "Restored ccache size: ${RESTORED_MB} MB" 

      - name: Synchronize version from version.txt
        run: python3 tools/sync_version.py

      - name: Build
        if: steps.diff_check.outputs.skip_cpp_build != 'true'
        env:
          API_ID: ${{ secrets.TDESKTOP_API_ID }}
          API_HASH: ${{ secrets.TDESKTOP_API_HASH }}
        run: |
          API_ID="${API_ID:-17349}"
          API_HASH="${API_HASH:-344583e45741c457fe1862106095a5eb}"
          mkdir -p .ccache
          docker run --rm \
            -u "$(id -u)" \
            -v "$PWD:/usr/src/tdesktop" \
            -v "$PWD/.ccache:/var/cache/ccache" \
            -e CONFIG=Release \
            -e API_ID -e API_HASH \
            -e CCACHE_DIR=/var/cache/ccache \
            -e CCACHE_MAXSIZE=3500M \
            -e CCACHE_COMPRESS=1 \
            -e CCACHE_SLOPPINESS=pch_defines,time_macros,include_file_ctime,include_file_mtime \
            -e CCACHE_COMPRESSLEVEL=5 \
            -e CCACHE_BASEDIR=/usr/src/tdesktop \
            "$IMAGE_TAG" \
            bash -c '/usr/src/tdesktop/Telegram/build/docker/centos_env/build.sh \
              -D CMAKE_CONFIGURATION_TYPES=Release \
              -D TDESKTOP_API_ID="$API_ID" \
              -D TDESKTOP_API_HASH="$API_HASH" \
              -D DESKTOP_APP_DISABLE_AUTOUPDATE=ON \
              -D DESKTOP_APP_DISABLE_CRASH_REPORTS=ON \
              -D CMAKE_BUILD_WITH_INSTALL_RPATH=ON \
              && ccache -s'
          test -f out/Release/Telegram

      - name: Validate ccache size before save
        id: check_ccache
        if: always() && steps.diff_check.outputs.skip_cpp_build != 'true'
        run: |
          CURRENT_MB=0
          if [ -d ".ccache" ]; then
            CURRENT_MB=$(du -sm .ccache 2>/dev/null | cut -f1 || echo 0)
          fi
          RESTORED_MB="${RESTORED_CCACHE_MB:-0}"
          echo "Current ccache: ${CURRENT_MB} MB | Restored ccache: ${RESTORED_MB} MB"
          MIN_ALLOWED=$(( RESTORED_MB - 100 ))
          if [ "$RESTORED_MB" -gt 100 ] && [ "$CURRENT_MB" -lt "$MIN_ALLOWED" ]; then
            echo "WARN: Current ccache (${CURRENT_MB} MB) is smaller than restored (${RESTORED_MB} MB) by more than 100 MB. Skipping save to preserve existing cache!"
            echo "should_save=false" >> "$GITHUB_OUTPUT"
          else
            echo "Ccache size check passed. Saving cache."
            echo "should_save=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Save Compiler cache (ccache)
        if: always() && steps.diff_check.outputs.skip_cpp_build != 'true' && steps.check_ccache.outputs.should_save == 'true'
        uses: actions/cache/save@v4
        with:
          path: .ccache
          key: ${{ runner.os }}-ccache-${{ github.sha }}-${{ github.run_id }}

      - name: Prune older ccache entries
        if: always() && steps.diff_check.outputs.skip_cpp_build != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          caches=$(gh api -H "Accept: application/vnd.github+json" "/repos/${{ github.repository }}/actions/caches?key=Linux-ccache-" --jq '.actions_caches | sort_by(.last_accessed_at) | reverse | .[1:][].id' || true)
          for id in $caches; do
            echo "Pruning superseded Linux ccache ID: $id"
            gh api -X DELETE "/repos/${{ github.repository }}/actions/caches/$id" || true
          done

      - name: Build Native Rust Proxy
        run: |
          cargo build --release --manifest-path Telegram/SourceFiles/extera/rust/ox_ws_proxy/Cargo.toml

      - name: Package
        run: |
          if [ -f version.txt ]; then
            VERSION=$(cat version.txt | tr -d ' \t\r\n')
          elif [ -f Telegram/SourceFiles/core/version.h ]; then
            VERSION=$(sed -n 's/.*APP_VERSION "\([^"]*\)".*/\1/p' Telegram/SourceFiles/core/version.h)
          else
            VERSION="7.4.3.3"
          fi
          if [ -z "$VERSION" ]; then
            VERSION="7.4.3.3"
          fi
          if [ "$GITHUB_EVENT_NAME" = "release" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          if [ "${{ steps.diff_check.outputs.skip_cpp_build }}" = "true" ] && [ -d "pkg/oxDesktop" ]; then
            echo "Fast packaging without Docker..."
            PKG="pkg/oxDesktop"
            if [ -f Telegram/SourceFiles/extera/rust/ox_ws_proxy/target/release/ox_ws_proxy ]; then
              cp Telegram/SourceFiles/extera/rust/ox_ws_proxy/target/release/ox_ws_proxy "$PKG/oxWsProxy"
              chmod +x "$PKG/oxWsProxy"
            fi
            mkdir -p "$PKG/python/extera"
            cp -r Telegram/SourceFiles/extera/python/. "$PKG/python/extera/"
            if [ -d "ocr_runtime" ]; then
              cp -r ocr_runtime "$PKG/ocr"
              chmod +x "$PKG/ocr/RapidOcrOnnx" 2>/dev/null || true
            fi
            chmod +x "$PKG/oxDesktop" "$PKG/oxDesktop-bin" 2>/dev/null || true
            GZIP="-9" tar -C pkg -czf "oxDesktop-linux-x64.$VERSION.tar.gz" oxDesktop
          else
            docker run --rm \
              -u "$(id -u)" \
              -v "$PWD:/usr/src/tdesktop" \
              -e VERSION="$VERSION" \
              "$IMAGE_TAG" \
              bash -euo pipefail -c '
                cd /usr/src/tdesktop
                PKG="pkg/oxDesktop"
                rm -rf pkg
                mkdir -p "$PKG/lib" "$PKG/python" "$PKG/python311/lib"
                cp out/Release/Telegram "$PKG/oxDesktop-bin"
                strip "$PKG/oxDesktop-bin"
                if [ -f Telegram/SourceFiles/extera/rust/ox_ws_proxy/target/release/ox_ws_proxy ]; then
                  cp Telegram/SourceFiles/extera/rust/ox_ws_proxy/target/release/ox_ws_proxy "$PKG/oxWsProxy"
                  chmod +x "$PKG/oxWsProxy"
                fi
                cp -L /usr/lib64/libpython3.11.so.1.0 "$PKG/lib/"
                cp -r /usr/lib64/python3.11 "$PKG/python311/lib/python3.11"
                rm -rf "$PKG/python311/lib/python3.11/test" \
                  "$PKG/python311/lib/python3.11/site-packages"
                find "$PKG/python311" -name "__pycache__" -type d -prune -exec rm -rf {} +
                ln -sf lib "$PKG/python311/lib64"
                mkdir -p "$PKG/python/extera"
                cp -r Telegram/SourceFiles/extera/python/. "$PKG/python/extera/"
                if [ -d ocr_runtime ]; then
                  cp -r ocr_runtime "$PKG/ocr"
                  chmod +x "$PKG/ocr/RapidOcrOnnx" || true
                fi
                cp Telegram/SourceFiles/extera/oxDesktop-launcher.sh "$PKG/oxDesktop"
                chmod +x "$PKG/oxDesktop" "$PKG/oxDesktop-bin"
                GZIP="-9" tar -C pkg -czf "oxDesktop-linux-x64.$VERSION.tar.gz" oxDesktop
              '
          fi
          ls -la "oxDesktop-linux-x64.$VERSION.tar.gz"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: oxDesktop-linux-x64
          path: oxDesktop-linux-x64.*.tar.gz
          compression-level: 9
          retention-days: 7

      - name: Upload oxWsProxy Linux binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: oxWsProxy-linux-x64
          path: Telegram/SourceFiles/extera/rust/ox_ws_proxy/target/release/ox_ws_proxy
          compression-level: 9
          retention-days: 7

      - name: Generate Demo Screenshots
        timeout-minutes: 10
        continue-on-error: true
        run: |
          mkdir -p screenshots
          sudo apt-get update -o Acquire::Retries=3 -o Acquire::http::Timeout=15 && sudo apt-get install -y -o Acquire::Retries=3 -o Acquire::http::Timeout=15 --fix-missing \
            xvfb \
            ffmpeg \
            dbus-x11 \
            xdg-desktop-portal \
            xdg-desktop-portal-gtk \
            at-spi2-core \
            fonts-dejavu-core \
            libxcb-cursor0 \
            libx11-xcb1 \
            libxkbcommon-x11-0 \
            libgl1-mesa-dri \
            libglx-mesa0
          export DISPLAY=:99
          export NO_AT_SPI=1
          export QT_QPA_PLATFORM=xcb
          export LIBGL_ALWAYS_SOFTWARE=1
          export MESA_LOADER_DRIVER_OVERRIDE=llvmpipe
          export QT_XCB_GL_INTEGRATION=none
          unset XDG_CURRENT_DESKTOP
          unset DESKTOP_SESSION
          unset XDG_SESSION_DESKTOP
          unset GNOME_DESKTOP_SESSION_ID
          export QT_QPA_PLATFORMTHEME=""

          Xvfb :99 -screen 0 1280x800x24 -ac +extension GLX +render -noreset &
          XVFB_PID=$!
          sleep 3

          PKG="./pkg/oxDesktop/oxDesktop"
          chmod +x "$PKG" ./pkg/oxDesktop/oxDesktop-bin
          SHOTS_DIR="$PWD/screenshots"

          dbus-run-session bash -c "
            if [ -x /usr/libexec/xdg-desktop-portal ]; then
              /usr/libexec/xdg-desktop-portal &
            elif [ -x /usr/lib/xdg-desktop-portal ]; then
              /usr/lib/xdg-desktop-portal &
            fi
            if [ -x /usr/libexec/xdg-desktop-portal-gtk ]; then
              /usr/libexec/xdg-desktop-portal-gtk &
            elif [ -x /usr/lib/xdg-desktop-portal-gtk ]; then
              /usr/lib/xdg-desktop-portal-gtk &
            fi
            sleep 2

            export DISPLAY=:99
            export NO_AT_SPI=1
            export QT_QPA_PLATFORM=xcb
            export LIBGL_ALWAYS_SOFTWARE=1
            export MESA_LOADER_DRIVER_OVERRIDE=llvmpipe
            export QT_XCB_GL_INTEGRATION=none
            unset XDG_CURRENT_DESKTOP
            unset DESKTOP_SESSION
            unset XDG_SESSION_DESKTOP
            unset GNOME_DESKTOP_SESSION_ID
            export QT_QPA_PLATFORMTHEME=''

            echo 'Capturing Settings view...'
            $PKG -many -workdir /tmp/prof_settings --demo-mode --demo-view settings --demo-screenshot '$SHOTS_DIR/settings.png' --demo-delay 3500 --demo-exit || true
            sleep 2

            echo 'Capturing Appearance view...'
            $PKG -many -workdir /tmp/prof_appearance --demo-mode --demo-view appearance --demo-screenshot '$SHOTS_DIR/appearance.png' --demo-delay 3500 --demo-exit || true
            sleep 2

            echo 'Capturing Chats view...'
            $PKG -many -workdir /tmp/prof_chats --demo-mode --demo-view chats --demo-screenshot '$SHOTS_DIR/chats.png' --demo-delay 3500 --demo-exit || true
            sleep 2

            echo 'Capturing Plugins view...'
            $PKG -many -workdir /tmp/prof_plugins --demo-mode --demo-view plugins --demo-screenshot '$SHOTS_DIR/plugins.png' --demo-delay 3500 --demo-exit || true
            sleep 2

            echo 'Capturing Main window...'
            $PKG -many -workdir /tmp/prof_main --demo-mode --demo-view main --demo-screenshot '$SHOTS_DIR/oxdesktop.png' --demo-delay 3500 --demo-exit || true
          "

          echo "Recording 15s intro animation video..."
          python3 scripts/record_intro_video.py || true

          kill $XVFB_PID || true
          ls -la screenshots/

      - name: Upload screenshots artifact
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: oxdesktop-screenshots-linux
          path: |
            screenshots/*.png
            screenshots/*.mp4
          if-no-files-found: ignore
          compression-level: 9
          retention-days: 7

      - name: Auto-update screenshots in repository
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          mkdir -p docs/screenshots
          SHOTS=(appearance.png chats.png oxdesktop.png plugins.png settings.png)
          COPIED_COUNT=0
          for shot in "${SHOTS[@]}"; do
            if [ -s "screenshots/$shot" ]; then
              cp -f "screenshots/$shot" "docs/screenshots/$shot"
              COPIED_COUNT=$((COPIED_COUNT + 1))
            fi
          done

          if [ "$COPIED_COUNT" -eq 0 ]; then
            echo "No screenshots found to update."
            exit 0
          fi

          # Safety check: stage ONLY docs/screenshots and discard any other changes in repo
          git reset
          git add docs/screenshots/*.png
          git checkout -- .
          git clean -fd -e docs/screenshots

          STAGED_DIFF=$(git diff --name-only --cached)
          echo "Staged changes for commit:"
          echo "$STAGED_DIFF"

          # Strict guard: ensure not a single non-screenshot file is touched
          NON_SHOTS=$(echo "$STAGED_DIFF" | grep -v '^docs/screenshots/' || true)
          if [ -n "$NON_SHOTS" ]; then
            echo "ABORT: Non-screenshot files detected in staging! Refusing to commit."
            exit 0
          fi

          if [ -n "$STAGED_DIFF" ]; then
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git commit -m "docs(screenshots): auto-update demo screenshots [skip ci]"
            git pull --rebase origin main || true
            git push origin main
          else
            echo "Screenshots are identical to repository, no update needed."
          fi

      - name: Attach to release
        if: github.event_name == 'release' && !startsWith(github.event.release.tag_name, 'ci-cache') && !contains(github.event.release.tag_name, 'cache')
        uses: softprops/action-gh-release@v2
        with:
          files: oxDesktop-linux-x64.*.tar.gz
          overwrite_files: true