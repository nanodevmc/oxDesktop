name: Windows build

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'badges.json'
      - 'trusted_hashes.json'
      - 'README.md'
      - 'README.ru.md'
      - 'CHANGELOG*'
      - 'changelog.txt'
      - 'install.sh'
      - 'install.ps1'
      - 'flatpak/**'
      - 'scripts/**'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/pull_request_template.md'
      - '.github/workflows/generate-screenshots.yml'
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360
    env:
      SCCACHE_DIR: "${{ github.workspace }}\\.sccache"
      SCCACHE_CACHE_SIZE: "3500M"
      SCCACHE_DIRECT: "true"
      SCCACHE_IDLE_TIMEOUT: "0"
      CLEAR_QT_BUILD_TREE: "1"
    permissions:
      contents: write
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: tdesktop
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Restore ThirdParty libraries from Release
        id: libs_release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $archive = "oxDesktop-ThirdParty-win64.7z"
          try {
            gh release download ci-cache-win64 --pattern $archive --dir .
            if (Test-Path $archive) {
              Write-Host "Found prebuilt libraries in release! Extracting..."
              7z x $archive -y | Out-Null
              Remove-Item $archive -Force
              "LIBS_CACHE_HIT=true" >> $env:GITHUB_ENV
              "LIBS_SOURCE=release" >> $env:GITHUB_ENV
              exit 0
            }
          } catch {
            Write-Host "Release cache check: $_"
          }
          "LIBS_CACHE_HIT=false" >> $env:GITHUB_ENV
          "LIBS_SOURCE=none" >> $env:GITHUB_ENV

      - name: Restore ThirdParty libraries (Actions Cache fallback)
        if: env.LIBS_CACHE_HIT != 'true'
        id: libs
        uses: actions/cache/restore@v4
        with:
          path: |
            Libraries
            ThirdParty
          key: win-libs-v3-${{ hashFiles('tdesktop/Telegram/build/prepare/prepare.py', 'tdesktop/Telegram/build/prepare/win.bat') }}
          restore-keys: |
            win-libs-v3-

      - name: Update LIBS_CACHE_HIT from fallback
        if: env.LIBS_CACHE_HIT != 'true' && steps.libs.outputs.cache-hit == 'true'
        shell: pwsh
        run: |
          "LIBS_CACHE_HIT=true" >> $env:GITHUB_ENV
          "LIBS_SOURCE=cache" >> $env:GITHUB_ENV

      - name: Install ATL for Breakpad
        shell: pwsh
        env:
          LIBS_CACHE_HIT: ${{ env.LIBS_CACHE_HIT }}
        run: |
          $installer = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer'
          $vswhere = Join-Path $installer 'vswhere.exe'
          $setup = Join-Path $installer 'setup.exe'
          $toolsComponent = 'Microsoft.VisualStudio.Component.VC.14.44.17.14.x86.x64'
          $atlComponent = 'Microsoft.VisualStudio.Component.VC.14.44.17.14.ATL'
          $vsPath = @(& $vswhere -latest -products '*' -requires $toolsComponent -property installationPath)[0]
          if (-not $vsPath) { throw "No Visual Studio instance provides $toolsComponent." }

          $toolset = Get-ChildItem (Join-Path $vsPath 'VC\Tools\MSVC') -Directory |
            Where-Object { $_.Name -like '14.44.*' } |
            Sort-Object Name -Descending |
            Select-Object -First 1
          if (-not $toolset) { throw "The selected Visual Studio instance has no 14.44 toolset." }
          $header = Join-Path $toolset.FullName 'atlmfc\include\atlbase.h'
          "VCVARS64=$vsPath\VC\Auxiliary\Build\vcvars64.bat" >> $env:GITHUB_ENV

          if ($env:LIBS_CACHE_HIT -eq 'true' -and (Test-Path $header)) {
            Write-Host 'Exact ThirdParty cache hit and ATL is present; skipping ATL installation.'
            exit 0
          }

          if (-not (Test-Path $header)) {
            $process = Start-Process -FilePath $setup -Wait -PassThru -ArgumentList @(
              'modify', '--installPath', "`"$vsPath`"", '--add', $atlComponent,
              '--quiet', '--norestart', '--nocache'
            )
            if ($process.ExitCode -notin @(0, 3010)) { throw "Visual Studio Installer exited with $($process.ExitCode)." }
          }
          if (-not (Test-Path $header)) { throw "ATL for 14.44 was not installed at $header." }

      - name: Build ThirdParty libraries
        shell: cmd
        env:
          LIBS_CACHE_HIT: ${{ env.LIBS_CACHE_HIT }}
          # fetch_archive.py queries the GitHub API, unauthenticated it hits the rate limit.
          GH_TOKEN: ${{ github.token }}
        run: |
          call "%VCVARS64%" -vcvars_ver=14.44
          if /I "%LIBS_CACHE_HIT%"=="true" if exist "%VCToolsInstallDir%atlmfc\include\atlbase.h" goto skipAtlValidation
          if not exist "%VCToolsInstallDir%atlmfc\include\atlbase.h" (echo ATL for selected toolset is missing & exit /b 1)
          echo %INCLUDE% | findstr /I /C:"%VCToolsInstallDir%atlmfc\include" >nul
          if errorlevel 1 (echo ATL include path is missing from INCLUDE & exit /b 1)
          :skipAtlValidation
          tdesktop\Telegram\build\prepare\win.bat silent

      - name: Remove temporary Qt build tree
        shell: pwsh
        run: |
          $libraryRoot = Join-Path $env:GITHUB_WORKSPACE 'Libraries\win64'
          $installedQt = Get-ChildItem -LiteralPath $libraryRoot -Directory -Filter 'Qt-*' | Select-Object -First 1
          if (-not $installedQt) { throw "Installed Qt prefix not found under $libraryRoot." }

          Get-ChildItem -LiteralPath $libraryRoot -Directory -Filter 'qt_*' | ForEach-Object {
            Get-ChildItem -LiteralPath $_.FullName -Force | Remove-Item -Recurse -Force
          }

      - name: Publish ThirdParty libraries to Release (one-time)
        if: success() && env.LIBS_SOURCE != 'release'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $archive = "oxDesktop-ThirdParty-win64.7z"
          Write-Host "Packaging prebuilt libraries to $archive..."
          7z a -mx=3 $archive Libraries ThirdParty | Out-Null
          try {
            gh release view ci-cache-win64
            gh release upload ci-cache-win64 $archive --clobber
          } catch {
            gh release create ci-cache-win64 $archive --title "CI Cache (Win64 Libraries)" --notes "Automated permanent prebuilt libraries cache" --prerelease
          }
          Remove-Item $archive -Force

      # Plugin engine links against an embedded Python 3.11, expected at
      # Libraries/win64/python311 with include/, libs/python311.lib and embed/.
      - name: Restore embedded Python 3.11 cache
        id: cache-python311
        uses: actions/cache@v4
        with:
          path: Libraries/win64/python311
          key: win64-python-3.11.9-embed-headers-v1

      - name: Fetch embedded Python 3.11
        if: steps.cache-python311.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $dest = Join-Path $env:GITHUB_WORKSPACE "Libraries\win64\python311"
          New-Item -ItemType Directory -Force $dest | Out-Null
          Invoke-WebRequest "https://www.python.org/ftp/python/3.11.9/python-3.11.9-embed-amd64.zip" -OutFile embed.zip
          Expand-Archive embed.zip "$dest\embed" -Force
          Invoke-WebRequest "https://www.nuget.org/api/v2/package/python/3.11.9" -OutFile python.nupkg.zip
          Expand-Archive python.nupkg.zip nuget -Force
          Copy-Item nuget\tools\include "$dest\include" -Recurse -Force
          Copy-Item nuget\tools\libs "$dest\libs" -Recurse -Force

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (!(Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --yes --no-progress
          } else {
            Write-Host "Inno Setup already present on runner."
          }

      - name: Restore Compiler cache (sccache)
        uses: actions/cache/restore@v4
        with:
          path: .sccache
          key: win64-sccache-v3-${{ github.sha }}-${{ github.run_id }}
          restore-keys: |
            win64-sccache-v3-${{ github.sha }}-
            win64-sccache-v3-

      - name: Check restored sccache size
        shell: pwsh
        run: |
          $sizeMb = 0
          if (Test-Path '.sccache') {
            $bytes = (Get-ChildItem -Path '.sccache' -Recurse -File -ErrorAction SilentlyContinue | Measure-Object -Property Length -Sum).Sum
            if ($bytes) { $sizeMb = [math]::Round($bytes / 1MB, 2) }
          }
          "RESTORED_SCCACHE_MB=$sizeMb" >> $env:GITHUB_ENV
          Write-Host "Restored sccache size: $sizeMb MB"

      - name: Enable sccache
        id: sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      # -vcvars_ver=14.44 is what docs/building-win.md pins for Windows 7
      # support. If a runner's VS install doesn't ship that exact toolset
      # this will fail and needs adjusting to whatever is actually there.
      - name: Set build number from tag
        if: github.event_name == 'release'
        shell: pwsh
        run: |
          $parts = $env:GITHUB_REF_NAME.TrimStart('v').Split('.')
          $build = if ($parts.Count -ge 4) { [int]$parts[3] } else { 0 }
          $file = 'tdesktop/Telegram/SourceFiles/extera/extera_update.cpp'
          $text = Get-Content -LiteralPath $file -Raw
          $text = $text -replace 'constexpr auto kExteraBuild = \d+;', "constexpr auto kExteraBuild = $build;"
          Set-Content -LiteralPath $file -Value $text -NoNewline
          Select-String -LiteralPath $file -Pattern 'kExteraBuild ='

      - name: Synchronize version from version.txt
        shell: cmd
        run: cd /d %GITHUB_WORKSPACE%\tdesktop && python tools\sync_version.py

      - name: Configure and build
        id: build
        shell: cmd
        env:
          API_ID: ${{ secrets.TDESKTOP_API_ID }}
          API_HASH: ${{ secrets.TDESKTOP_API_HASH }}
        run: |
          call "%VCVARS64%" -vcvars_ver=14.44
          sccache --start-server
          sccache --show-stats
          set "CREDS=-D TDESKTOP_API_ID=%API_ID% -D TDESKTOP_API_HASH=%API_HASH%"
          if "%API_ID%"=="" (
            echo No API secrets, using TEST ONLY credentials
            set "CREDS=-D TDESKTOP_API_TEST=ON"
          )
          rem No /Z7: with embedded debug info the final link of Telegram.exe
          rem runs out of memory (LNK1102), options_win.cmake then uses /DEBUG:NONE.
          cd tdesktop\Telegram
          call configure.bat %CREDS% ^
            -G "Ninja Multi-Config" ^
            -D CMAKE_C_COMPILER_LAUNCHER=sccache ^
            -D CMAKE_CXX_COMPILER_LAUNCHER=sccache ^
            -D CMAKE_DISABLE_PRECOMPILED_HEADERS=ON ^
            -D CMAKE_MSVC_DEBUG_INFORMATION_FORMAT= ^
            -D CMAKE_POLICY_CMP0141=NEW
          cd ..\out
          cmake --build . --config Release --target Telegram --parallel

      - name: Report sccache statistics and flush
        if: always() && steps.sccache.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        run: |
          $sccache = if (Get-Command sccache -ErrorAction SilentlyContinue) { 'sccache' } elseif ($env:SCCACHE_PATH -and (Test-Path "$env:SCCACHE_PATH.exe")) { "$env:SCCACHE_PATH.exe" } elseif ($env:SCCACHE_PATH -and (Test-Path $env:SCCACHE_PATH)) { $env:SCCACHE_PATH } else { $null }
          if ($sccache) {
            try { & $sccache --show-stats } catch { Write-Host "sccache show-stats: $_" }
            try { & $sccache --stop-server } catch { Write-Host "sccache stop-server: $_" }
          }
          $global:LASTEXITCODE = 0

      - name: Validate sccache size before save
        id: check_sccache
        if: always()
        shell: pwsh
        run: |
          $currentMb = 0
          if (Test-Path '.sccache') {
            $bytes = (Get-ChildItem -Path '.sccache' -Recurse -File -ErrorAction SilentlyContinue | Measure-Object -Property Length -Sum).Sum
            if ($bytes) { $currentMb = [math]::Round($bytes / 1MB, 2) }
          }
          $restoredMb = [double]($env:RESTORED_SCCACHE_MB ?? 0)
          Write-Host "Current sccache: $currentMb MB | Restored sccache: $restoredMb MB"
          $minAllowed = $restoredMb - 100
          if ($restoredMb -gt 100 -and $currentMb -lt $minAllowed) {
            Write-Warning "Current sccache ($currentMb MB) is smaller than restored ($restoredMb MB) by more than 100 MB. Skipping save to preserve existing cache!"
            "should_save=false" >> $env:GITHUB_OUTPUT
          } else {
            Write-Host "Sccache size check passed. Saving cache."
            "should_save=true" >> $env:GITHUB_OUTPUT
          }

      - name: Save Compiler cache (sccache)
        if: always() && steps.check_sccache.outputs.should_save == 'true'
        uses: actions/cache/save@v4
        with:
          path: .sccache
          key: win64-sccache-v3-${{ github.sha }}-${{ github.run_id }}

      - name: Package
        shell: pwsh
        run: |
          $release = Join-Path $env:GITHUB_WORKSPACE 'tdesktop\out\Release'
          $versionHeader = Get-Content 'tdesktop\Telegram\SourceFiles\core\version.h' -Raw
          if ($versionHeader -notmatch 'AppVersionStr\s*=\s*"([^"]+)"') { throw 'AppVersionStr was not found' }
          $version = $Matches[1]
          $packageVersion = $version
          if ($env:GITHUB_EVENT_NAME -eq 'release') { $packageVersion = $env:GITHUB_REF_NAME.TrimStart('v') }
          $portable = Join-Path $env:GITHUB_WORKSPACE 'oxDesktop-windows-x64'
          New-Item -ItemType Directory -Path $portable -Force | Out-Null
          if (Test-Path (Join-Path $release 'Telegram.exe')) {
            Copy-Item (Join-Path $release 'Telegram.exe') (Join-Path $release 'oxDesktop.exe') -Force
          }
          Copy-Item (Join-Path $release 'oxDesktop.exe') (Join-Path $portable 'oxDesktop.exe') -Force
          Copy-Item (Join-Path $release 'python') $portable -Recurse
          Copy-Item (Join-Path $release 'modules') $portable -Recurse
          if (Test-Path (Join-Path $release 'Updater.exe')) { Copy-Item (Join-Path $release 'Updater.exe') $portable }
          $cl = Join-Path $env:GITHUB_WORKSPACE 'tdesktop\changelog.txt'
          if (Test-Path $cl) {
            Copy-Item $cl $release -Force
            Copy-Item $cl $portable -Force
          }
          $portableZip = "oxDesktop-portable-x64.$packageVersion.zip"
          Compress-Archive -Path (Join-Path $portable '*') -DestinationPath (Join-Path $env:GITHUB_WORKSPACE $portableZip) -Force
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          $setup = Join-Path $env:GITHUB_WORKSPACE 'tdesktop\Telegram\build\setup.iss'
          $setupArgs = @(
            '/dSkipSign',
            "/dMyAppVersion=$version",
            "/dMyAppVersionZero=$version.0",
            "/dMyAppVersionFull=$packageVersion",
            "/dMyOutputBaseFilename=oxDesktop-setup-x64.$packageVersion",
            "/dReleasePath=$release",
            '/dMyBuildTarget=win64',
            $setup
          )
          & $iscc @setupArgs
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup failed' }
          "BUILD_VERSION=$packageVersion" >> $env:GITHUB_ENV

      - name: Prune older sccache entries
        if: always()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          try {
            $cachesJson = gh api -H "Accept: application/vnd.github+json" "/repos/${{ github.repository }}/actions/caches?key=win64-sccache-v3-"
            $caches = ($cachesJson | ConvertFrom-Json).actions_caches | Sort-Object -Property last_accessed_at -Descending
            if ($caches.Count -gt 1) {
              $toDelete = $caches | Select-Object -Skip 1
              foreach ($c in $toDelete) {
                Write-Host "Pruning superseded sccache entry: $($c.key) (ID: $($c.id), Size: $([math]::Round($c.size_in_bytes / 1MB, 1)) MB)"
                gh api -X DELETE "/repos/${{ github.repository }}/actions/caches/$($c.id)" | Out-Null
              }
            }
          } catch {
            Write-Host "Cache prune warning: $_"
          }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: oxDesktop-windows-installer
          path: tdesktop/out/Release/oxDesktop-setup-x64.*.exe
          compression-level: 9

      - name: Upload portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: oxDesktop-windows-portable
          path: oxDesktop-portable-x64.*.zip
          compression-level: 9

      - name: Attach to release
        if: github.event_name == 'release'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$env:RELEASE_TAG" "oxDesktop-portable-x64.$env:BUILD_VERSION.zip" "tdesktop\out\Release\oxDesktop-setup-x64.$env:BUILD_VERSION.exe" --clobber
