<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 600 500" width="600" height="500">
  <defs>
    <filter id="mach-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur1" />
      <feGaussianBlur stdDeviation="8" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <radialGradient id="plasmaThrust" cx="50%" cy="0%" r="90%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="30%" stop-color="#38bdf8" stop-opacity="0.85" />
      <stop offset="70%" stop-color="#da3018" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#da3018" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="shockwaveGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="40%" stop-color="#60a5fa" stop-opacity="0.7" />
      <stop offset="80%" stop-color="#38bdf8" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
  </defs>

  <style>
    /* Continuous smooth flight with NOSE ALWAYS POINTING IN FLIGHT DIRECTION (4.80s) */
    @keyframes smoothFlight {
        0.0% { transform: translate(298.7px, 390.0px) rotate(270.4deg) scale(0.850); opacity: 0.00; }
        2.0% { transform: translate(268.7px, 388.3px) rotate(276.5deg) scale(0.851); opacity: 0.19; }
        4.0% { transform: translate(239.4px, 383.4px) rotate(282.7deg) scale(0.853); opacity: 0.38; }
        6.0% { transform: translate(211.4px, 375.5px) rotate(289.2deg) scale(0.856); opacity: 0.58; }
        8.0% { transform: translate(185.5px, 364.8px) rotate(296.2deg) scale(0.860); opacity: 0.77; }
       10.0% { transform: translate(162.2px, 351.5px) rotate(303.8deg) scale(0.864); opacity: 0.96; }
       12.0% { transform: translate(142.0px, 335.8px) rotate(312.2deg) scale(0.870); opacity: 1.00; }
       14.0% { transform: translate(125.3px, 318.2px) rotate(321.6deg) scale(0.876); opacity: 1.00; }
       16.0% { transform: translate(112.7px, 299.1px) rotate(332.1deg) scale(0.883); opacity: 1.00; }
       18.0% { transform: translate(104.3px, 278.8px) rotate(343.5deg) scale(0.891); opacity: 1.00; }
       20.0% { transform: translate(100.3px, 257.9px) rotate(355.6deg) scale(0.900); opacity: 1.00; }
       22.0% { transform: translate(100.9px, 236.8px) rotate(7.9deg) scale(0.909); opacity: 1.00; }
       24.0% { transform: translate(106.0px, 216.0px) rotate(19.9deg) scale(0.919); opacity: 1.00; }
       26.0% { transform: translate(115.5px, 196.0px) rotate(31.1deg) scale(0.930); opacity: 1.00; }
       28.0% { transform: translate(129.1px, 177.2px) rotate(41.2deg) scale(0.941); opacity: 1.00; }
       30.0% { transform: translate(146.7px, 160.1px) rotate(50.3deg) scale(0.953); opacity: 1.00; }
       32.0% { transform: translate(167.7px, 145.0px) rotate(58.5deg) scale(0.966); opacity: 1.00; }
       34.0% { transform: translate(191.8px, 132.3px) rotate(65.9deg) scale(0.979); opacity: 1.00; }
       36.0% { transform: translate(218.3px, 122.2px) rotate(72.7deg) scale(0.993); opacity: 1.00; }
       38.0% { transform: translate(246.6px, 115.1px) rotate(79.2deg) scale(1.008); opacity: 1.00; }
       40.0% { transform: translate(276.2px, 111.0px) rotate(85.3deg) scale(1.023); opacity: 1.00; }
       42.0% { transform: translate(306.3px, 110.1px) rotate(91.4deg) scale(1.039); opacity: 1.00; }
       44.0% { transform: translate(336.2px, 112.3px) rotate(97.5deg) scale(1.056); opacity: 1.00; }
       46.0% { transform: translate(365.4px, 117.7px) rotate(103.7deg) scale(1.073); opacity: 1.00; }
       48.0% { transform: translate(393.0px, 126.1px) rotate(110.3deg) scale(1.091); opacity: 1.00; }
       50.0% { transform: translate(418.6px, 137.3px) rotate(117.4deg) scale(1.109); opacity: 1.00; }
       52.0% { transform: translate(441.4px, 151.0px) rotate(125.2deg) scale(1.128); opacity: 1.00; }
       54.0% { transform: translate(461.1px, 167.0px) rotate(133.7deg) scale(1.148); opacity: 1.00; }
       56.0% { transform: translate(477.0px, 184.9px) rotate(143.3deg) scale(1.168); opacity: 1.00; }
       58.0% { transform: translate(489.0px, 204.2px) rotate(153.9deg) scale(1.189); opacity: 1.00; }
       60.0% { transform: translate(496.7px, 224.6px) rotate(165.5deg) scale(1.210); opacity: 1.00; }
       62.0% { transform: translate(499.9px, 245.6px) rotate(177.7deg) scale(1.232); opacity: 1.00; }
       64.0% { transform: translate(498.6px, 266.7px) rotate(190.0deg) scale(1.254); opacity: 1.00; }
       66.0% { transform: translate(492.7px, 287.4px) rotate(201.8deg) scale(1.277); opacity: 1.00; }
       68.0% { transform: translate(479.2px, 306.2px) rotate(234.6deg) scale(1.301); opacity: 1.00; }
       70.0% { transform: translate(450.7px, 317.9px) rotate(258.5deg) scale(1.325); opacity: 1.00; }
       72.0% { transform: translate(413.8px, 320.2px) rotate(274.0deg) scale(1.350); opacity: 1.00; }
       74.0% { transform: translate(375.7px, 313.3px) rotate(287.1deg) scale(1.375); opacity: 1.00; }
       76.0% { transform: translate(342.7px, 299.1px) rotate(300.2deg) scale(1.401); opacity: 1.00; }
       78.0% { transform: translate(318.6px, 281.2px) rotate(314.5deg) scale(1.427); opacity: 1.00; }
       80.0% { transform: translate(305.0px, 264.1px) rotate(330.6deg) scale(1.454); opacity: 1.00; }
       82.0% { transform: translate(300.3px, 252.5px) rotate(348.5deg) scale(1.481); opacity: 1.00; }
       84.0% { transform: translate(300.0px, 250.0px) rotate(0.0deg) scale(1.532); opacity: 0.86; }
       86.0% { transform: translate(300.0px, 250.0px) rotate(0.0deg) scale(1.628); opacity: 0.44; }
       88.0% { transform: translate(300.0px, 250.0px) rotate(0.0deg) scale(1.724); opacity: 0.02; }
       90.0% { transform: translate(300.0px, 250.0px) rotate(0.0deg) scale(1.820); opacity: 0.00; }
       92.0% { transform: translate(300.0px, 250.0px) rotate(0.0deg) scale(1.916); opacity: 0.00; }
       94.0% { transform: translate(300.0px, 250.0px) rotate(0.0deg) scale(2.012); opacity: 0.00; }
       96.0% { transform: translate(300.0px, 250.0px) rotate(0.0deg) scale(2.108); opacity: 0.00; }
       98.0% { transform: translate(300.0px, 250.0px) rotate(0.0deg) scale(2.204); opacity: 0.00; }
      100.0% { transform: translate(300.0px, 250.0px) rotate(0.0deg) scale(2.300); opacity: 0.00; }
    }

    /* Supersonic Mach Shockwave: detonates at 83.3% */
    @keyframes machShockwave {
      0%, 82% {
        opacity: 0;
        transform: translate(300px, 250px) scale(0.05);
      }
      83.3% {
        opacity: 1;
        transform: translate(300px, 250px) scale(0.2);
      }
      89% {
        opacity: 0.95;
        transform: translate(300px, 250px) scale(1.5);
      }
      95% {
        opacity: 0.35;
        transform: translate(300px, 250px) scale(2.7);
      }
      100% {
        opacity: 0;
        transform: translate(300px, 250px) scale(3.4);
      }
    }

    /* Blinding Anamorphic Flare Streak */
    @keyframes lensStreak {
      0%, 82% {
        opacity: 0;
        transform: translate(300px, 250px) scaleX(0.01) scaleY(0.2);
      }
      83.3% {
        opacity: 1;
        transform: translate(300px, 250px) scaleX(1.8) scaleY(1.0);
      }
      87% {
        opacity: 0.8;
        transform: translate(300px, 250px) scaleX(2.8) scaleY(0.4);
      }
      93% {
        opacity: 0.2;
        transform: translate(300px, 250px) scaleX(3.4) scaleY(0.1);
      }
      100% {
        opacity: 0;
        transform: translate(300px, 250px) scaleX(3.6) scaleY(0.02);
      }
    }

    /* Kinetic supersonic sparks */
    @keyframes sparkBurst {
      0%, 82% {
        opacity: 0;
        transform: translate(300px, 250px) scale(0.1);
      }
      83.3% {
        opacity: 1;
        transform: translate(300px, 250px) scale(0.4);
      }
      92% {
        opacity: 0.8;
        transform: translate(300px, 250px) scale(2.2);
      }
      100% {
        opacity: 0;
        transform: translate(300px, 250px) scale(3.2);
      }
    }

    .plane-container {
      animation: smoothFlight 4.8s cubic-bezier(0.42, 0.0, 0.58, 1.0) infinite;
      transform-origin: 0 0;
    }

    .shock-ring {
      animation: machShockwave 4.8s cubic-bezier(0.1, 0.8, 0.2, 1.0) infinite;
      transform-origin: 0 0;
    }

    .streak-light {
      animation: lensStreak 4.8s cubic-bezier(0.1, 0.9, 0.2, 1.0) infinite;
      transform-origin: 0 0;
    }

    .spark-group {
      animation: sparkBurst 4.8s cubic-bezier(0.1, 0.8, 0.2, 1.0) infinite;
      transform-origin: 0 0;
    }
  </style>

  <!-- PURE TRANSPARENT BACKGROUND (No box, no overlay) -->

  <!-- Supersonic Shockwave Rings -->
  <g class="shock-ring">
    <circle r="140" fill="none" stroke="#60a5fa" stroke-width="3" filter="url(#mach-glow)" opacity="0.9" />
    <circle r="95" fill="none" stroke="#ffffff" stroke-width="4.5" filter="url(#mach-glow)" opacity="0.95" />
    <circle r="50" fill="url(#shockwaveGlow)" opacity="0.85" />
  </g>

  <!-- Anamorphic Mach Light Streaks -->
  <g class="streak-light">
    <ellipse rx="260" ry="4" fill="#ffffff" filter="url(#mach-glow)" opacity="0.95" />
    <ellipse rx="320" ry="1.5" fill="#38bdf8" opacity="0.8" />
    <line x1="-140" y1="-35" x2="140" y2="35" stroke="#ffffff" stroke-width="2" filter="url(#mach-glow)" opacity="0.75" />
    <line x1="-140" y1="35" x2="140" y2="-35" stroke="#38bdf8" stroke-width="1.5" opacity="0.6" />
  </g>

  <!-- Kinetic Supersonic Sparks -->
  <g class="spark-group">
    <line x1="0" y1="0" x2="45" y2="25" stroke="#ffffff" stroke-width="2" filter="url(#mach-glow)" />
    <line x1="0" y1="0" x2="-45" y2="-25" stroke="#ffffff" stroke-width="2" filter="url(#mach-glow)" />
    <line x1="0" y1="0" x2="30" y2="-40" stroke="#38bdf8" stroke-width="2" />
    <line x1="0" y1="0" x2="-30" y2="40" stroke="#38bdf8" stroke-width="2" />
    <line x1="0" y1="0" x2="50" y2="-15" stroke="#ffffff" stroke-width="1.5" />
    <line x1="0" y1="0" x2="-50" y2="15" stroke="#ffffff" stroke-width="1.5" />
  </g>

  <!-- Moving Stealth Delta Craft -->
  <g class="plane-container">
    <!-- Plasmatic engine thrust flame behind tail -->
    <path d="M -8,25 L 0,65 L 8,25 Z" fill="url(#plasmaThrust)" />
    <path d="M -4,25 L 0,42 L 4,25 Z" fill="#ffffff" opacity="0.9" />
    <!-- Exact original emblem glyph directly embedded as base64 image (nose points UP) -->
    <image href="data:image/png;base64," x="-50" y="-50" width="100" height="100" />
  </g>
</svg>