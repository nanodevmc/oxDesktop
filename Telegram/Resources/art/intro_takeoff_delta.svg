<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 600 500" width="600" height="500">
  <defs>
    <filter id="mach-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur1" />
      <feGaussianBlur stdDeviation="8" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <radialGradient id="plasmaThrust" cx="50%" cy="0%" r="90%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="30%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="70%" stop-color="#da3018" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#da3018" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="shockwaveGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="40%" stop-color="#60a5fa" stop-opacity="0.7" />
      <stop offset="80%" stop-color="#da3018" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
  </defs>

  <style>
    /* Continuous smooth flight with NOSE ALWAYS POINTING IN FLIGHT DIRECTION */
    @keyframes smoothFlight {
      0% {
        transform: translate(300px, 270px) rotate(0deg) scale(0.9);
        opacity: 0;
      }
      6% {
        transform: translate(300px, 260px) rotate(0deg) scale(0.95);
        opacity: 1;
      }
      15% {
        transform: translate(300px, 220px) rotate(0deg) scale(1.0);
      }
      25% {
        transform: translate(360px, 180px) rotate(55deg) scale(1.02);
      }
      38% {
        transform: translate(420px, 150px) rotate(15deg) scale(0.98);
      }
      50% {
        transform: translate(360px, 115px) rotate(-75deg) scale(0.95);
      }
      62% {
        transform: translate(230px, 125px) rotate(-100deg) scale(0.95);
      }
      72% {
        transform: translate(175px, 185px) rotate(-155deg) scale(1.0);
      }
      82% {
        transform: translate(215px, 255px) rotate(-90deg) scale(1.08);
      }
      88% {
        transform: translate(275px, 265px) rotate(-25deg) scale(1.2);
      }
      92% {
        transform: translate(300px, 250px) rotate(0deg) scale(1.6);
        opacity: 1;
      }
      95% {
        transform: translate(300px, 250px) rotate(0deg) scale(2.2);
        opacity: 0;
      }
      100% {
        transform: translate(300px, 250px) rotate(0deg) scale(2.4);
        opacity: 0;
      }
    }

    /* Supersonic Mach Shockwave: detonates at 92%-98% */
    @keyframes machShockwave {
      0%, 90% {
        opacity: 0;
        transform: translate(300px, 250px) scale(0.05);
      }
      92% {
        opacity: 1;
        transform: translate(300px, 250px) scale(0.3);
      }
      95% {
        opacity: 0.9;
        transform: translate(300px, 250px) scale(1.7);
      }
      98% {
        opacity: 0;
        transform: translate(300px, 250px) scale(3.0);
      }
      100% {
        opacity: 0;
        transform: translate(300px, 250px) scale(3.2);
      }
    }

    /* Blinding Anamorphic Flare Streak */
    @keyframes lensStreak {
      0%, 91% {
        opacity: 0;
        transform: translate(300px, 250px) scaleX(0.01) scaleY(0.2);
      }
      93% {
        opacity: 1;
        transform: translate(300px, 250px) scaleX(1.9) scaleY(1.0);
      }
      96% {
        opacity: 0.6;
        transform: translate(300px, 250px) scaleX(2.8) scaleY(0.3);
      }
      99%, 100% {
        opacity: 0;
        transform: translate(300px, 250px) scaleX(3.4) scaleY(0.05);
      }
    }

    .plane-container {
      animation: smoothFlight 2.8s cubic-bezier(0.42, 0.0, 0.58, 1.0) infinite;
      transform-origin: 0 0;
    }

    .shock-ring {
      animation: machShockwave 2.8s cubic-bezier(0.1, 0.8, 0.2, 1.0) infinite;
      transform-origin: 0 0;
    }

    .streak-light {
      animation: lensStreak 2.8s cubic-bezier(0.1, 0.9, 0.2, 1.0) infinite;
      transform-origin: 0 0;
    }
  </style>

  <!-- PURE TRANSPARENT BACKGROUND (No box, no overlay) -->

  <!-- Supersonic Shockwave Rings -->
  <g class="shock-ring">
    <circle r="130" fill="none" stroke="#60a5fa" stroke-width="3" filter="url(#mach-glow)" opacity="0.9" />
    <circle r="90" fill="none" stroke="#ffffff" stroke-width="4.5" filter="url(#mach-glow)" opacity="0.95" />
    <circle r="45" fill="url(#shockwaveGlow)" opacity="0.85" />
  </g>

  <!-- Anamorphic Mach Light Streaks -->
  <g class="streak-light">
    <ellipse rx="240" ry="4" fill="#ffffff" filter="url(#mach-glow)" opacity="0.95" />
    <ellipse rx="300" ry="1.5" fill="#38bdf8" opacity="0.8" />
    <line x1="-130" y1="-30" x2="130" y2="30" stroke="#ffffff" stroke-width="2" filter="url(#mach-glow)" opacity="0.75" />
    <line x1="-130" y1="30" x2="130" y2="-30" stroke="#da3018" stroke-width="1.5" opacity="0.6" />
  </g>

  <!-- Moving Stealth Delta Craft -->
  <g class="plane-container">
    <!-- Plasma exhaust flame attached to tail (behind the aircraft) -->
    <path d="M -10,25 L 0,65 L 10,25 Z" fill="url(#plasmaThrust)" />
    <!-- Exact original emblem glyph directly embedded as base64 image (nose points UP) -->
    <image href="data:image/png;base64," x="-50" y="-50" width="100" height="100" />
  </g>
</svg>