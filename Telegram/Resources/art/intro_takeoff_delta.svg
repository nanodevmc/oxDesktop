<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 540" width="400" height="540" style="background: transparent;">
  <defs>
    <linearGradient id="velocityBeam" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="25%" stop-color="#da3018" stop-opacity="0.85" />
      <stop offset="70%" stop-color="#da3018" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#da3018" stop-opacity="0.0" />
    </linearGradient>
    <radialGradient id="impulseRing" cx="50%" cy="50%" r="50%">
      <stop offset="70%" stop-color="#ffffff" stop-opacity="0.0" />
      <stop offset="90%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="98%" stop-color="#da3018" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#da3018" stop-opacity="0.0" />
    </radialGradient>
  </defs>

  <style>
    @keyframes supersonicSurge {
      0.0%  { transform: translate(200.0px, 116.0px) scale(1.0); opacity: 1.0; }
      12.0% { transform: translate(200.0px, 118.5px) scale(0.95); opacity: 1.0; }
      28.0% { transform: translate(200.0px, 76.0px) scale(1.04); opacity: 1.0; }
      45.0% { transform: translate(200.0px, -44.0px) scale(1.12); opacity: 0.9; }
      60.0% { transform: translate(200.0px, -204.0px) scale(1.20); opacity: 0.0; }
      100.0%{ transform: translate(200.0px, -204.0px) scale(1.20); opacity: 0.0; }
    }

    @keyframes streakPulse {
      0.0%  { opacity: 0.0; transform: scaleY(0.01); }
      12.0% { opacity: 0.0; transform: scaleY(0.01); }
      25.0% { opacity: 0.9; transform: scaleY(0.6); }
      45.0% { opacity: 0.85; transform: scaleY(1.3); }
      60.0% { opacity: 0.0; transform: scaleY(1.8); }
      100.0%{ opacity: 0.0; transform: scaleY(0.01); }
    }

    @keyframes groundRing {
      0.0%  { transform: translate(200.0px, 128.8px) scale(0.15, 0.05); opacity: 0.0; }
      12.0% { transform: translate(200.0px, 128.8px) scale(0.65, 0.22); opacity: 0.9; }
      40.0% { transform: translate(200.0px, 128.8px) scale(1.60, 0.55); opacity: 0.0; }
      100.0%{ transform: translate(200.0px, 128.8px) scale(1.60, 0.55); opacity: 0.0; }
    }

    .craft {
      animation: supersonicSurge 1.4s cubic-bezier(0.1, 0.0, 0.2, 1.0) infinite;
    }
    .streak {
      transform-origin: 0px 48px;
      animation: streakPulse 1.4s cubic-bezier(0.1, 0.0, 0.2, 1.0) infinite;
    }
    .ring {
      transform-origin: 0px 0px;
      animation: groundRing 1.4s cubic-bezier(0.1, 0.0, 0.2, 1.0) infinite;
    }
  </style>

  <!-- PURE TRANSPARENT OVERLAY: Ground Optical Mach Pulse Ring -->
  <circle class="ring" r="60" fill="url(#impulseRing)" />

  <!-- Supersonic Craft Group Taking Off from Exact Resting Spot -->
  <g class="craft">
    <path class="streak" d="M -28,48 L -2,240 L 2,240 L 28,48 Z" fill="url(#velocityBeam)" />
    <rect class="streak" x="-1.5" y="48" width="3" height="120" fill="#ffffff" opacity="0.9" />
    <image href="data:image/png;base64," x="-80.0" y="-80.0" width="160.0" height="160.0" />
  </g>
</svg>
