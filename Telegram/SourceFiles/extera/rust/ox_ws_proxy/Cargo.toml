[package]
name = "ox_ws_proxy"
version = "1.0.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
aes = "0.8"
ctr = "0.9"
sha2 = "0.10"
rand = "0.8"
hex = "0.4"
futures-util = "0.3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
