app-id: io.github.nanodevmc.oxDesktop
runtime: org.kde.Platform
runtime-version: '6.7'
sdk: org.kde.Sdk
command: oxDesktop

finish-args:
  - --share=ipc
  - --share=network
  - --socket=fallback-x11
  - --socket=wayland
  - --socket=pulseaudio
  - --device=dri
  - --filesystem=xdg-download
  - --filesystem=xdg-documents:ro
  - --filesystem=xdg-pictures:ro
  - --filesystem=xdg-music:ro
  - --filesystem=xdg-videos:ro
  - --filesystem=xdg-run/pipewire-0
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.kde.StatusNotifierWatcher
  - --system-talk-name=org.freedesktop.login1
  - --system-talk-name=org.freedesktop.UPower
  - --own-name=org.telegram.desktop.*

modules:
  - name: oxDesktop
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DTDESKTOP_API_ID=17349
      - -DTDESKTOP_API_HASH=344583e45741c457fe1862106095a5eb
      - -DDESKTOP_APP_USE_PACKAGED=ON
      - -DDESKTOP_APP_DISABLE_AUTOUPDATE=ON
      - -DDESKTOP_APP_DISABLE_CRASH_REPORTS=ON
    sources:
      - type: git
        url: https://github.com/nanodevmc/oxDesktop.git
        branch: main
    post-install:
      - install -Dm644 ../Telegram/Resources/art/oxdesktop.png /app/share/icons/hicolor/512x512/apps/io.github.nanodevmc.oxDesktop.png
      - install -Dm644 ../flatpak/io.github.nanodevmc.oxDesktop.desktop /app/share/applications/io.github.nanodevmc.oxDesktop.desktop
      - install -Dm644 ../flatpak/io.github.nanodevmc.oxDesktop.metainfo.xml /app/share/metainfo/io.github.nanodevmc.oxDesktop.metainfo.xml
