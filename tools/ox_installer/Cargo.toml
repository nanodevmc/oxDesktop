[package]
name = "ox_installer"
version = "7.4.6"
edition = "2021"

[dependencies]
google_material_symbols = "0.3.1"
zip = { version = "2.4", default-features = false, features = ["deflate", "zstd"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Controls",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_UI_Shell",
    "Win32_System_LibraryLoader",
    "Win32_System_Com",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_Storage_FileSystem",
    "Win32_System_Memory",
] }

[build-dependencies]
zip = { version = "2.4", default-features = false, features = ["deflate", "zstd"] }

[target.'cfg(windows)'.build-dependencies]
winres = "0.1.12"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
